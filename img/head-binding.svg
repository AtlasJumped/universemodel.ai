<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="Diagram of a Chinookan cradleboard seen from the side: an infant lies swaddled on a long board, and a second board hinged at the head end is bound down at an angle across the forehead.">
  <rect width="560" height="300" rx="14" fill="#F4F8FE"/>
  <!-- ground shadow -->
  <ellipse cx="280" cy="252" rx="232" ry="9" fill="#0B2545" opacity=".07"/>
  <!-- the long board the infant lies on -->
  <rect x="44" y="214" width="474" height="20" rx="6" fill="#D2A86A" stroke="#8A6A3B" stroke-width="2"/>
  <path d="M60 221h440M60 227h440" stroke="#8A6A3B" stroke-width="1" opacity=".35"/>
  <!-- swaddled body, laced to the board -->
  <path d="M214 214 C214 176 240 160 290 158 C360 156 440 168 486 190 C500 197 502 208 492 214 Z" fill="#E7EDF7" stroke="#8FA6C8" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#7A5C2E" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M250 166 L274 214M298 159 L322 214M346 160 L370 214M394 166 L418 214M440 178 L462 214"/>
    <path d="M274 162 L250 214M322 159 L298 214M370 162 L346 214M418 171 L394 214M462 186 L440 214" opacity=".55"/>
  </g>
  <!-- head, face up, back of the skull flat on the board, forehead sloped by the pressing board -->
  <path d="M96 214 C84 206 86 192 98 182 L176 126 C183 121 191 124 193 131 C194 136 192 139 196 142 C202 146 205 149 201 153 C199 155 197 156 198 159 C200 163 199 166 196 168 C200 172 202 176 199 180 C205 186 212 190 216 198 L216 214 Z" fill="#F3D2B8" stroke="#B4835F" stroke-width="2" stroke-linejoin="round"/>
  <path d="M172 150 q7 -3 12 1" fill="none" stroke="#7C5A45" stroke-width="2" stroke-linecap="round"/>
  <path d="M160 190 c-7 -3 -13 3 -10 10 c2 5 8 7 12 3" fill="none" stroke="#B4835F" stroke-width="1.6" stroke-linecap="round"/>
  <!-- pad and pressing board, hinged at the head end -->
  <path d="M94 186 L180 124" stroke="#EFE6D2" stroke-width="9" stroke-linecap="round"/>
  <path d="M94 186 L180 124" stroke="#B9A77F" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 5"/>
  <g transform="rotate(-35.8 62 204)">
    <rect x="56" y="188" width="176" height="15" rx="5" fill="#D2A86A" stroke="#8A6A3B" stroke-width="2"/>
  </g>
  <circle cx="64" cy="206" r="6.5" fill="#8A6A3B"/>
  <!-- cords from the free end of the pressing board down to the long board -->
  <g stroke="#7A5C2E" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M196 104 L226 214"/><path d="M186 111 L206 214" opacity=".55"/>
  </g>
  <!-- pressure arrow -->
  <path d="M100 100 L124 136" stroke="#C2412D" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M124 136 l-11 -5 m11 5 l-1 -12" stroke="#C2412D" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- labels -->
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#0B2545">
    <text x="30" y="52" font-weight="600">Pressing board, bound down</text>
    <text x="30" y="71" fill="#4A5D7A">at an angle over a soft pad</text>
    <text x="250" y="96" font-weight="600">Cords that bind it to the cradleboard</text>
    <path d="M246 100 L214 132" stroke="#4A5D7A" stroke-width="1.2" fill="none"/>
    <text x="150" y="266" font-weight="600">Cradleboard: the infant lay on it for its first year</text>
  </g>
</svg>
